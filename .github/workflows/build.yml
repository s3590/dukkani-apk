name: Build VIP Store APK (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      appName:
        description: 'اسم البقالة (سيظهر على شاشة الهاتف)'
        required: true
        default: 'دُكّاني أعمال'
      logoUrl:
        description: 'رابط الشعار المباشر'
        required: true
        default: 'https://dukkani-app.onrender.com/static/logo_customer.png'

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/assets -D

    - name: Create dummy www folder
      run: mkdir www && echo "<html><body>Loading...</body></html>" > www/index.html

    - name: Update App Name dynamically
      run: |
        APP_NAME="${{ github.event.inputs.appName || 'دُكّاني أعمال' }}"
        node -e "const fs = require('fs' ); let cfg = JSON.parse(fs.readFileSync('capacitor.config.json')); cfg.appName = '$APP_NAME'; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));"

    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Inject Notification Channel in MainActivity
      run: |
        MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
        # استخراج اسم الحزمة برمجياً من الملف الأصلي
        PACKAGE_NAME=$(grep -oP '^package \K[^;]+' $MAIN_ACTIVITY)
        
        # إعادة كتابة الملف بالكامل لضمان سلامة الكود وعدم خروج الأقواس
        cat <<EOF > $MAIN_ACTIVITY
        package $PACKAGE_NAME;

        import com.getcapacitor.BridgeActivity;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.media.AudioAttributes;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationManager notificationManager = getSystemService(NotificationManager.class);
                    if (notificationManager != null) {
                        NotificationChannel channel = new NotificationChannel("dukkani_alerts", "إشعارات الطلبات", NotificationManager.IMPORTANCE_HIGH);
                        Uri soundUri = Uri.parse("android.resource://" + getPackageName() + "/raw/bell");
                        AudioAttributes audioAttributes = new AudioAttributes.Builder()
                                .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                .build();
                        channel.setSound(soundUri, audioAttributes);
                        channel.enableVibration(true);
                        notificationManager.createNotificationChannel(channel);
                    }
                }
            }
        }
        EOF

    - name: Change Version and Permissions
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${RUN_NUMBER}/g" android/app/build.gradle
        sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"1.0.${RUN_NUMBER}\"/g" android/app/build.gradle
        
        sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
        
        sed -i 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/colorPrimary" />\n</application>|' android/app/src/main/AndroidManifest.xml

    - name: Generate App Icons
      run: |
        mkdir assets
        curl -o assets/icon.png "${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}"
        curl -o assets/splash.png "${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}"
        npx capacitor-assets generate --android

    - name: Add optional custom notification sound
      run: |
        set -Eeuo pipefail
        mkdir -p android/app/src/main/res/raw
        if [ -f bell.mp3 ]; then
          cp bell.mp3 android/app/src/main/res/raw/bell.mp3
          echo '✅ تمت إضافة bell.mp3.'
        else
          echo 'ℹ️ bell.mp3 غير موجود؛ سيتم استخدام الصوت الافتراضي.'
        fi

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "⚠️ تحذير: لم يتم العثور على سر GOOGLE_SERVICES_JSON!"
        else
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        fi

    - name: Inject Firebase Push Notifications
      run: |
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        sed -i '/dependencies {/a \    implementation platform("com.google.firebase:firebase-bom:32.1.1"   )\n    implementation "com.google.firebase:firebase-messaging"' android/app/build.gradle

    - name: Build unsigned release APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Align, Sign and Extract SHA-256
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        
        BUILD_TOOLS_DIR="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
        APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
        FINAL_APK="Dukkani-Release.apk"

        "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_PATH" app-aligned.apk
        "$BUILD_TOOLS_DIR/apksigner" sign \
          --ks release.keystore \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass "pass:$KEYSTORE_PASSWORD" \
          --key-pass "pass:$KEY_PASSWORD" \
          --out "$FINAL_APK" \
          app-aligned.apk

        SHA_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK" | grep "SHA-256 digest:" | head -n 1)
        echo "SHA256_FINGERPRINT=${SHA_OUTPUT}" >> $GITHUB_ENV

    - name: Publish GitHub Release (Direct APK Link)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        name: ${{ github.event.inputs.appName || 'دُكّاني' }} - الإصدار 1.0.${{ github.run_number }}
        body: |
          تطبيق بقالة جاهز وموقّع.
          البصمة: `${{ env.SHA256_FINGERPRINT }}`
        files: Dukkani-Release.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Telegram Success Notification
      if: ${{ success() }}
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        ADMIN_ID: ${{ secrets.ADMIN_ID }}
        RUN_NUMBER: ${{ github.run_number }}
        REPOSITORY: ${{ github.repository }}
        APP_NAME: ${{ github.event.inputs.appName || 'دُكّاني أعمال' }}
        SHA_FINGERPRINT: ${{ env.SHA256_FINGERPRINT }}
      run: |
        MESSAGE="✅ **تم بناء التطبيق بنجاح!**
        
        🏪 البقالة: ${APP_NAME}
        📦 الإصدار: 1.0.${RUN_NUMBER}
        
        🔗 **رابط التحميل المباشر (APK):**
        https://github.com/${REPOSITORY}/releases/download/v1.0.${RUN_NUMBER}/Dukkani-Release.apk
        
        🔐 **بصمة التطبيق (انسخها للسيرفر ):**
        \`${SHA_FINGERPRINT}\`"

        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${ADMIN_ID}" \
          --data-urlencode "text=${MESSAGE}" \
          --data-urlencode "parse_mode=Markdown"

    - name: Cleanup Sensitive Files
      if: ${{ always( ) }}
      run: |
        rm -f release.keystore
        rm -f app-aligned.apk
