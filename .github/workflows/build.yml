name: Build VIP Store APK (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      appName:
        description: "اسم البقالة (سيظهر على شاشة الهاتف)"
        required: true
        default: "دُكّاني أعمال"
      appUrl:
        description: "رابط المتجر المستهدف"
        required: true
        default: "https://dukkani-app.onrender.com"
      logoUrl:
        description: "رابط الشعار المباشر"
        required: true
        default: "https://dukkani-app.onrender.com/static/logo_customer.png"

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_NAME: ${{ github.event.inputs.appName || 'دُكّاني أعمال' }}
      TARGET_URL: ${{ github.event.inputs.appUrl || 'https://dukkani-app.onrender.com' }}
      LOGO_URL: ${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}
      NOTIFICATION_CHANNEL_ID: dukkani_alerts_vip_v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Validate application URL
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "❌ يجب أن يبدأ appUrl بـ https://"; exit 1 ;;
          esac
          case "$LOGO_URL" in
            https://*) ;;
            *) echo "❌ يجب أن يبدأ logoUrl بـ https://"; exit 1 ;;
          esac

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Create Web Assets (fallback while server is loading)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#0f172a">
            <title>جاري الاتصال بالنظام</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; }
              body {
                background: #0f172a;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: -apple-system, BlinkMacSystemFont, "Cairo", sans-serif;
                text-align: center;
                padding: 24px;
              }
              .spinner {
                width: 48px;
                height: 48px;
                border: 4px solid rgba(11, 163, 96, 0.25);
                border-top-color: #0ba360;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 20px;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
              h2 { margin: 0 0 8px; font-weight: 900; font-size: 22px; }
              p { margin: 0; font-size: 14px; color: #94a3b8; line-height: 1.6; }
              button {
                margin-top: 24px;
                background: #0ba360;
                color: #ffffff;
                border: none;
                padding: 14px 28px;
                border-radius: 12px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
              }
              button:active { transform: scale(0.95); }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <h2>جاري الاتصال بالنظام...</h2>
            <p>قد يستغرق التحميل بضع ثوانٍ في المرة الأولى.</p>
            <button onclick="location.reload()">إعادة المحاولة</button>
          </body>
          </html>
          HTML

      - name: Verify Capacitor packages
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "require.resolve('@capacitor/android/package.json')" 2>/dev/null; then
            echo "❌ @capacitor/android غير مثبت."
            echo "   أضفه في package.json: \"@capacitor/android\": \"^5.7.0\""
            exit 1
          fi
          if ! node -e "require.resolve('@capacitor/core/package.json')" 2>/dev/null; then
            echo "❌ @capacitor/core غير مثبت."
            exit 1
          fi
          echo "✅ جميع حزم Capacitor موجودة."

      - name: Configure Capacitor and Live Server URL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const appName = process.env.APP_NAME;
          const targetUrl = process.env.TARGET_URL.replace(/\/$/, '');
          const targetHost = new URL(targetUrl).hostname;
          const configPath = 'capacitor.config.json';
          let cfg = {};

          if (fs.existsSync(configPath)) {
            cfg = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          }

          cfg.appId = cfg.appId || 'com.dukkani.app';
          cfg.appName = appName;
          cfg.webDir = 'www';
          const existingAllowNavigation = Array.isArray(cfg.server?.allowNavigation)
            ? cfg.server.allowNavigation
            : [];
          cfg.server = {
            ...(cfg.server || {}),
            url: targetUrl,
            cleartext: false,
            androidScheme: 'https',
            allowNavigation: [...new Set([...existingAllowNavigation, targetHost])],
            errorPath: 'index.html'
          };

          fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2) + '\n');
          console.log('✅ تم ضبط capacitor.config.json (مع errorPath).');
          NODE

      - name: Add Android Platform and Sync
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Notification Channel
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' \) | head -n 1)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "❌ لم يتم العثور على MainActivity.java أو MainActivity.kt"
            exit 1
          fi

          PACKAGE_NAME="$(sed -nE 's/^package[[:space:]]+([^;]+);?$/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          if [ -z "$PACKAGE_NAME" ]; then
            echo "❌ تعذر استخراج package من $MAIN_ACTIVITY"
            exit 1
          fi

          ACTIVITY_DIR="$(dirname "$MAIN_ACTIVITY")"
          rm -f "$ACTIVITY_DIR/MainActivity.java" "$ACTIVITY_DIR/MainActivity.kt"
          cat > "$ACTIVITY_DIR/MainActivity.java" <<JAVA
          package $PACKAGE_NAME;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String CHANNEL_ID = "$NOTIFICATION_CHANNEL_ID";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createNotificationChannel();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;

                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (manager == null) return;

                  NotificationChannel existing = manager.getNotificationChannel(CHANNEL_ID);
                  if (existing != null) return;

                  // 🎵 إن وُجد res/raw/bell.mp3 استخدمه، وإلا صوت النظام الافتراضي
                  int soundResId = getResources().getIdentifier("bell", "raw", getPackageName());
                  Uri soundUri = (soundResId != 0)
                          ? Uri.parse("android.resource://" + getPackageName() + "/" + soundResId)
                          : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                  AudioAttributes audioAttributes = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .build();

                  NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "إشعارات دُكّاني",
                          NotificationManager.IMPORTANCE_HIGH
                  );
                  channel.setDescription("تنبيهات الطلبات والرسائل والعمليات النقدية");
                  channel.enableVibration(true);
                  channel.setSound(soundUri, audioAttributes);
                  channel.setShowBadge(true);
                  manager.createNotificationChannel(channel);
              }
          }
          JAVA

      - name: Configure Android Version and Permissions
        shell: bash
        run: |
          set -euo pipefail
          BUILD_GRADLE="android/app/build.gradle"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          if grep -qE 'versionCode[[:space:]]+[0-9]+' "$BUILD_GRADLE"; then
            sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" "$BUILD_GRADLE"
          else
            echo "⚠️ لم يتم تعديل versionCode تلقائيًا؛ راجع $BUILD_GRADLE"
          fi

          if grep -qE 'versionName[[:space:]]+"[^"]+"' "$BUILD_GRADLE"; then
            sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"${VERSION_NAME}\"/" "$BUILD_GRADLE"
          else
            echo "⚠️ لم يتم تعديل versionName تلقائيًا؛ راجع $BUILD_GRADLE"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.VIBRATE" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          for line in permissions:
              if line not in text:
                  text = text.replace('</manifest>', line + '\n</manifest>', 1)
          path.write_text(text)
          print('✅ AndroidManifest.xml updated with required permissions.')
          PY

      - name: Generate App Icons and Splash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$LOGO_URL" -o assets/icon.png
          cp assets/icon.png assets/splash.png
          npx @capacitor/assets generate --android

      - name: Add Custom Sound if Present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/raw
          if [ -f bell.mp3 ]; then
            cp bell.mp3 android/app/src/main/res/raw/bell.mp3
            echo '✅ تم نسخ bell.mp3 — سيُستخدم صوتًا افتراضيًا للإشعارات.'
          else
            echo 'ℹ️ لم يتم العثور على bell.mp3؛ سيستخدم التطبيق صوت النظام الافتراضي.'
          fi

      - name: Setup Firebase and Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo '❌ سر GOOGLE_SERVICES_JSON غير موجود.'
            echo '   إشعارات FCM لن تعمل في التطبيق بدون هذا الملف.'
            echo '   أضف السر في: Repository → Settings → Secrets and variables → Actions'
            echo '   اسم السر: GOOGLE_SERVICES_JSON'
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          # حماية google-services.json من الرفع للـ git (في حال عدم وجود .gitignore)
          if ! grep -q 'google-services.json' .gitignore 2>/dev/null; then
            echo 'android/app/google-services.json' >> .gitignore
          fi

          # Root build.gradle: إضافة classpath عبر Python (أكثر موثوقية من sed)
          python3 - android/build.gradle <<'PY'
          from pathlib import Path
          import sys, re
          path = Path(sys.argv[1])
          text = path.read_text()
          if 'com.google.gms:google-services' not in text:
              text = re.sub(
                  r'(dependencies\s*{)',
                  r'\1\n        classpath "com.google.gms:google-services:4.4.0"',
                  text,
                  count=1,
              )
              path.write_text(text)
              print('✅ classpath added to root build.gradle')
          else:
              print('ℹ️ classpath already present in root build.gradle')
          PY

          # App build.gradle: apply plugin + firebase-messaging
          python3 - android/app/build.gradle <<'PY'
          from pathlib import Path
          import sys, re
          path = Path(sys.argv[1])
          text = path.read_text()

          if 'com.google.gms.google-services' not in text:
              m = re.search(r"(apply plugin:\s*['\"]com\.android\.application['\"])", text)
              if m:
                  text = text.replace(
                      m.group(1),
                      m.group(1) + "\napply plugin: 'com.google.gms.google-services'",
                      1,
                  )
                  print('✅ google-services added after com.android.application (legacy DSL)')
              else:
                  text = re.sub(
                      r'(plugins\s*{\s*\n)',
                      r'\1    id "com.google.gms.google-services"\n',
                      text,
                      count=1,
                  )
                  print('✅ google-services added via modern plugins DSL')
          else:
              print('ℹ️ google-services already applied')

          if 'firebase-messaging' not in text:
              text = re.sub(
                  r'(dependencies\s*{)',
                  r'\1\n    implementation platform("com.google.firebase:firebase-bom:33.0.0")\n    implementation "com.google.firebase:firebase-messaging"',
                  text,
                  count=1,
              )
              print('✅ firebase-messaging dependencies added')

          path.write_text(text)
          PY
          echo '✅ تم إعداد Firebase وGoogle Services.'

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          ALIGNED_APK="$RUNNER_TEMP/app-aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/Dukkani-Release.apk"

          if [ -z "$APK_PATH" ]; then
            echo '❌ لم يتم العثور على ملف APK الناتج.'
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_PATH" "$ALIGNED_APK"

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"
            ALIAS="$KEY_ALIAS"
            KS_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            echo '🔐 سيتم استخدام مفتاح الإصدار من Secrets.'
          else
            echo '⚠️ لم تكتمل أسرار التوقيع؛ سيتم استخدام مفتاح Debug للتجربة فقط.'
            KS="$HOME/.android/debug.keystore"
            if [ ! -f "$KS" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            fi
            ALIAS='androiddebugkey'
            KS_PASS='android'
            KEY_PASS='android'
          fi

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"

          SHA_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK" 2>/dev/null | grep -i 'SHA-256 digest:' | head -n 1 | awk '{print $NF}' || true)
          echo "SHA256_FINGERPRINT=${SHA_OUTPUT:-N/A}" >> "$GITHUB_ENV"
          echo "✅ تم إنشاء APK موقع: $FINAL_APK"
          echo "🔑 بصمة SHA-256: ${SHA_OUTPUT:-N/A}"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "🚀 **تم بناء تطبيق Android بنجاح.**"
            echo ""
            echo "- **المتجر:** ${APP_NAME}"
            echo "- **الإصدار:** 1.0.${GITHUB_RUN_NUMBER}"
            echo "- **بصمة SHA-256:** \`${SHA256_FINGERPRINT:-N/A}\`"
          } > "$RUNNER_TEMP/release_notes.md"
          echo "✅ Notes written: $(wc -c < "$RUNNER_TEMP/release_notes.md") bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_NAME }} - v1.0.${{ github.run_number }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: Dukkani-Release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_NAME: ${{ env.APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${ADMIN_ID:-}" ]; then
            echo 'ℹ️ لم يتم توفير BOT_TOKEN أو ADMIN_ID؛ تم تخطي إشعار Telegram.'
            exit 0
          fi
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v1.0.${RUN_NUMBER}/Dukkani-Release.apk"
          FINGERPRINT="${SHA256_FINGERPRINT:-N/A}"
          MSG=$(cat <<EOF
          <b>تم بناء تطبيق Android بنجاح!</b>

          <b>المتجر:</b> ${APP_NAME}
          <b>الإصدار:</b> 1.0.${RUN_NUMBER}

          <b>رابط التحميل:</b>
          ${DOWNLOAD_URL}

          <b>بصمة SHA-256:</b>
          <code>${FINGERPRINT}</code>
          EOF
          )

          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML"

      - name: Cleanup Sensitive Build Files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/app-aligned.apk"
          rm -f android/app/google-services.json
