name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Create dummy www folder
      run: mkdir www && echo "<html><body>Loading...</body></html>" > www/index.html

    - name: Add Android Platform
      run: npx cap add android

    - name: Copy google-services.json
      run: cp google-services.json android/app/

    - name: Inject Firebase
      run: |
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Dukkani-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
