name: Build VIP Store APK (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      appName:
        description: "اسم البقالة (سيظهر على شاشة الهاتف)"
        required: true
        default: "بقالتي"
      appUrl:
        description: "رابط المتجر المستهدف"
        required: true
        default: "https://dukkani-app.onrender.com"
      logoUrl:
        description: "رابط الشعار المباشر"
        required: true
        default: "https://dukkani-app.onrender.com/static/logo_customer.png"

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_NAME: ${{ github.event.inputs.appName || 'دُكّاني أعمال' }}
      TARGET_URL: ${{ github.event.inputs.appUrl || 'https://dukkani-app.onrender.com' }}
      LOGO_URL: ${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Validate application URL
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "❌ يجب أن يبدأ appUrl بـ https://"; exit 1 ;;
          esac
          case "$LOGO_URL" in
            https://*) ;;
            *) echo "❌ يجب أن يبدأ logoUrl بـ https://"; exit 1 ;;
          esac

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Install Capacitor Assets
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "require.resolve('@capacitor/assets/package.json')" 2>/dev/null; then
            npm install --no-save @capacitor/assets
          fi
          echo "✅ @capacitor/assets ready"

      - name: Create Web Assets (Instant Redirect)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cat > www/index.html <<HTML
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#0f172a">
            <title>بقالتي</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; }
              body {
                background: #0f172a; color: #fff;
                display: flex; flex-direction: column;
                justify-content: center; align-items: center;
                font-family: -apple-system, "Cairo", sans-serif;
                text-align: center; padding: 24px;
              }
              .spinner {
                width: 48px; height: 48px;
                border: 4px solid rgba(11, 163, 96, 0.25);
                border-top-color: #0ba360;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-bottom: 20px;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
              h2 { margin: 0 0 8px; font-weight: 900; font-size: 22px; }
              p { margin: 0; font-size: 14px; color: #94a3b8; line-height: 1.6; }
              button {
                margin-top: 24px; background: #0ba360; color: #fff;
                border: none; padding: 14px 28px; border-radius: 12px;
                font-size: 16px; font-weight: bold; cursor: pointer;
              }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <h2>بقالتي</h2>
            <p>جاري تحميل التطبيق...</p>
            <button onclick="location.reload()">إعادة المحاولة</button>
            <script>
              // 🆕 انتقال فوري (بدون ping)
              window.location.replace("${TARGET_URL}");
            </script>
          </body>
          </html>
          HTML
          
      - name: Verify Capacitor packages
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "require.resolve('@capacitor/android/package.json')" 2>/dev/null; then
            echo "❌ @capacitor/android غير مثبت."
            echo "   أضفه في package.json: \"@capacitor/android\": \"^5.7.0\""
            exit 1
          fi
          if ! node -e "require.resolve('@capacitor/core/package.json')" 2>/dev/null; then
            echo "❌ @capacitor/core غير مثبت."
            exit 1
          fi
          # 🆕 التحقق من PushNotifications (إلزامي للإشعارات)
          if ! node -e "require.resolve('@capacitor/push-notifications/package.json')" 2>/dev/null; then
            echo "❌ @capacitor/push-notifications غير مثبت."
            echo "   أضفه في package.json: \"@capacitor/push-notifications\": \"^5.1.0\""
            exit 1
          fi
          echo "✅ جميع حزم Capacitor موجودة (بما فيها PushNotifications)."

      - name: Configure Capacitor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const appName = process.env.APP_NAME;
          const targetUrl = process.env.TARGET_URL.replace(/\/$/, '');
          const targetHost = new URL(targetUrl).hostname;
          const configPath = 'capacitor.config.json';
          let cfg = {};

          if (fs.existsSync(configPath)) {
            cfg = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          }

          cfg.appId = cfg.appId || 'com.dukkani.app';
          cfg.appName = appName;
          cfg.webDir = 'www';
          cfg.backgroundColor = '#0f172a';

          const existingAllowNavigation = Array.isArray(cfg.server?.allowNavigation)
            ? cfg.server.allowNavigation
            : [];
          cfg.server = {
            ...(cfg.server || {}),
            cleartext: false,
            androidScheme: 'https',
            allowNavigation: [...new Set([...existingAllowNavigation, targetHost])]
          };
          delete cfg.server.url;
          delete cfg.server.errorPath;

          cfg.plugins = cfg.plugins || {};
          cfg.plugins.PushNotifications = {
            presentationOptions: ['badge', 'sound', 'alert'],
            smallIcon: 'ic_stat_icon',
            iconColor: '#0ba360'
          };
          cfg.plugins.SplashScreen = {
            launchShowDuration: 500,
            launchAutoHide: true,
            backgroundColor: '#0f172a',
            showSpinner: false,
            androidSplashResourceName: 'splash',
            splashFullScreen: true,
            splashImmersive: true,
            androidScaleType: 'CENTER_CROP'
          };

          fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2) + '\n');
          console.log('✅ capacitor.config.json configured (no server.url).');
          NODE
          
      - name: Add Android Platform and Sync
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android (MainActivity + Manifest + Version)
        shell: bash
        run: |
          set -euo pipefail

          BUILD_GRADLE="android/app/build.gradle"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          sed -i 's/^\(\s*applicationId\s\).*/\1"com.dukkani.app"/' "$BUILD_GRADLE"

          python3 - "$BUILD_GRADLE" "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          vc, vn = sys.argv[2], sys.argv[3]
          text, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {vc}', text, count=1)
          text, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "{vn}"', text, count=1)
          path.write_text(text)
          print(f'✅ versionCode={vc}, versionName="{vn}" (matches: {n1}/{n2})')
          PY

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          perms = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          for p in perms:
              if p not in text:
                  text = text.replace('</manifest>', '    ' + p + '\n</manifest>', 1)
          path.write_text(text)
          print('✅ AndroidManifest.xml updated')
          PY

          MAIN_ACTIVITY="$(find android/app/src/main -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' \) | head -n 1)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "❌ MainActivity not found"; exit 1
          fi
          PKG="$(sed -nE 's/^package[[:space:]]+([^;]+);?$/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          DIR="$(dirname "$MAIN_ACTIVITY")"
          rm -f "$DIR/MainActivity.java" "$DIR/MainActivity.kt"

          cat > "$DIR/MainActivity.java" <<JAVA
          package $PKG;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final String CHANNEL_VIP      = "dukkani_alerts_vip_v2";
              private static final String CHANNEL_ORDERS   = "dukkani_orders";
              private static final String CHANNEL_MESSAGES = "dukkani_messages";
              private static final String CHANNEL_SYSTEM   = "dukkani_system";
              private static final String CHANNEL_LEGACY   = "dukkani_alerts_vip";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createNotificationChannels();
              }

              private void createNotificationChannels() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;

                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (manager == null) return;

                  int soundResId = getResources().getIdentifier("bell", "raw", getPackageName());
                  Uri soundUri = (soundResId != 0)
                          ? Uri.parse("android.resource://" + getPackageName() + "/" + soundResId)
                          : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                  AudioAttributes attrs = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .build();

                  createChannel(manager, CHANNEL_VIP,
                      "تنبيهات دُكّاني VIP",
                      "الإشعارات الأساسية للنظام",
                      soundUri, attrs);

                  createChannel(manager, CHANNEL_ORDERS,
                      "طلبات جديدة 🔔",
                      "إشعارات الطلبات الجديدة وتحديثاتها",
                      soundUri, attrs);

                  createChannel(manager, CHANNEL_MESSAGES,
                      "رسائل الزبائن 💬",
                      "رسائل الزبائن والدعم الفني",
                      soundUri, attrs);

                  createChannel(manager, CHANNEL_SYSTEM,
                      "تنبيهات النظام ⚙️",
                      "تحديثات إدارية وعروض",
                      soundUri, attrs);

                  createChannel(manager, CHANNEL_LEGACY,
                      "إشعارات دُكّاني (قديم)",
                      "للتوافق مع الرسائل القديمة",
                      soundUri, attrs);
              }

              private void createChannel(NotificationManager manager,
                                          String id, String name, String desc,
                                          Uri sound, AudioAttributes attrs) {
                  NotificationChannel existing = manager.getNotificationChannel(id);
                  if (existing != null) return;

                  NotificationChannel ch = new NotificationChannel(
                      id, name, NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription(desc);
                  ch.enableVibration(true);
                  ch.enableLights(true);
                  ch.setSound(sound, attrs);
                  ch.setShowBadge(true);
                  ch.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                  manager.createNotificationChannel(ch);
              }
          }
          JAVA
          echo "✅ MainActivity.java written with all channels"

 
      - name: Generate App Icons and Splash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$LOGO_URL" -o assets/icon.png
          cp assets/icon.png assets/splash.png
          npx capacitor-assets generate --android

      # ⬇️⬇️⬇️ هذا البلوك الجديد — ضعه هنا بالضبط ⬇️⬇️⬇️
      - name: Add Notification Small Icon (all densities + vector fallback)
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON=$(find "android/app/src/main/res/mipmap-${density}" -name 'ic_launcher.png' 2>/dev/null | head -n 1)
            if [ -n "$ICON" ]; then
              mkdir -p "android/app/src/main/res/drawable-${density}"
              cp "$ICON" "android/app/src/main/res/drawable-${density}/ic_stat_icon.png"
              echo "✅ ic_stat_icon.png → drawable-${density}"
            fi
          done
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          XML
          echo "✅ vector ic_stat_icon.xml created (crash-proof fallback)"
      # ⬆️⬆️⬆️ نهاية البلوك الجديد ⬆️⬆️⬆️

      - name: Add Custom Sound if Present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/raw
          if [ -f bell.mp3 ]; then
            cp bell.mp3 android/app/src/main/res/raw/bell.mp3
            echo '✅ تم نسخ bell.mp3 — سيُستخدم صوتًا افتراضيًا للإشعارات.'
          else
            echo 'ℹ️ لم يتم العثور على bell.mp3؛ سيستخدم التطبيق صوت النظام الافتراضي.'
          fi

      - name: Setup Firebase and Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo '❌ سر GOOGLE_SERVICES_JSON غير موجود.'
            echo '   إشعارات FCM لن تعمل في التطبيق بدون هذا الملف.'
            echo '   أضف السر في: Repository → Settings → Secrets and variables → Actions'
            echo '   اسم السر: GOOGLE_SERVICES_JSON'
            exit 1
          fi

          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json

          # حماية google-services.json من الرفع للـ git (في حال عدم وجود .gitignore)
          if ! grep -q 'google-services.json' .gitignore 2>/dev/null; then
            echo 'android/app/google-services.json' >> .gitignore
          fi

          # Root build.gradle: إضافة classpath عبر Python (أكثر موثوقية من sed)
          python3 - android/build.gradle <<'PY'
          from pathlib import Path
          import sys, re
          path = Path(sys.argv[1])
          text = path.read_text()
          if 'com.google.gms:google-services' not in text:
              text = re.sub(
                  r'(dependencies\s*{)',
                  r'\1\n        classpath "com.google.gms:google-services:4.4.0"',
                  text,
                  count=1,
              )
              path.write_text(text)
              print('✅ classpath added to root build.gradle')
          else:
              print('ℹ️ classpath already present in root build.gradle')
          PY

          # App build.gradle: apply plugin + firebase-messaging
          python3 - android/app/build.gradle <<'PY'
          from pathlib import Path
          import sys, re
          path = Path(sys.argv[1])
          text = path.read_text()

          if 'com.google.gms.google-services' not in text:
              m = re.search(r"(apply plugin:\s*['\"]com\.android\.application['\"])", text)
              if m:
                  text = text.replace(
                      m.group(1),
                      m.group(1) + "\napply plugin: 'com.google.gms.google-services'",
                      1,
                  )
                  print('✅ google-services added after com.android.application (legacy DSL)')
              else:
                  text = re.sub(
                      r'(plugins\s*{\s*\n)',
                      r'\1    id "com.google.gms.google-services"\n',
                      text,
                      count=1,
                  )
                  print('✅ google-services added via modern plugins DSL')
          else:
              print('ℹ️ google-services already applied')

          if 'firebase-messaging' not in text:
              text = re.sub(
                  r'(dependencies\s*{)',
                  r'\1\n    implementation platform("com.google.firebase:firebase-bom:33.0.0")\n    implementation "com.google.firebase:firebase-messaging"',
                  text,
                  count=1,
              )
              print('✅ firebase-messaging dependencies added')

          path.write_text(text)
          PY
          echo '✅ تم إعداد Firebase وGoogle Services.'

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          ALIGNED_APK="$RUNNER_TEMP/app-aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/Dukkani-Release.apk"

          if [ -z "$APK_PATH" ]; then
            echo '❌ لم يتم العثور على ملف APK الناتج.'
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_PATH" "$ALIGNED_APK"

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore" || {
              echo '❌ KEYSTORE_BASE64 غير صالح (base64 decode failed)'
              exit 1
            }
            KS="$RUNNER_TEMP/release.keystore"
            ALIAS="$KEY_ALIAS"
            KS_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            echo '🔐 سيتم استخدام مفتاح الإصدار من Secrets.'
          else
            echo '⚠️ لم تكتمل أسرار التوقيع؛ سيتم استخدام مفتاح Debug للتجربة فقط.'
            KS="$HOME/.android/debug.keystore"
            if [ ! -f "$KS" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            fi
            ALIAS='androiddebugkey'
            KS_PASS='android'
            KEY_PASS='android'
          fi

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"

          SHA_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK" 2>/dev/null | grep -i 'SHA-256 digest:' | head -n 1 | awk '{print $NF}' || true)
          echo "SHA256_FINGERPRINT=${SHA_OUTPUT:-N/A}" >> "$GITHUB_ENV"
          echo "✅ تم إنشاء APK موقع: $FINAL_APK"
          echo "🔑 بصمة SHA-256: ${SHA_OUTPUT:-N/A}"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "🚀 **تم بناء تطبيق Android بنجاح.**"
            echo ""
            echo "- **المتجر:** ${APP_NAME}"
            echo "- **الإصدار:** 1.0.${GITHUB_RUN_NUMBER}"
            echo "- **بصمة SHA-256:** \`${SHA256_FINGERPRINT:-N/A}\`"
          } > "$RUNNER_TEMP/release_notes.md"
          echo "✅ Notes written: $(wc -c < "$RUNNER_TEMP/release_notes.md") bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_NAME }} - v1.0.${{ github.run_number }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: Dukkani-Release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_NAME: ${{ env.APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${ADMIN_ID:-}" ]; then
            echo 'ℹ️ لم يتم توفير BOT_TOKEN أو ADMIN_ID؛ تم تخطي إشعار Telegram.'
            exit 0
          fi
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v1.0.${RUN_NUMBER}/Dukkani-Release.apk"
          FINGERPRINT="${SHA256_FINGERPRINT:-N/A}"
          MSG=$(cat <<EOF
          <b>تم بناء تطبيق Android بنجاح!</b>

          <b>المتجر:</b> ${APP_NAME}
          <b>الإصدار:</b> 1.0.${RUN_NUMBER}

          <b>رابط التحميل:</b>
          ${DOWNLOAD_URL}

          <b>بصمة SHA-256:</b>
          <code>${FINGERPRINT}</code>
          EOF
          )

          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML"

      - name: Cleanup Sensitive Build Files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/app-aligned.apk"
          rm -f android/app/google-services.json
