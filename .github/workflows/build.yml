name: Build VIP Store APK (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      appName:
        description: 'اسم البقالة (سيظهر على شاشة الهاتف)'
        required: true
        default: 'دُكّاني أعمال'
      logoUrl:
        description: 'رابط الشعار المباشر'
        required: true
        default: 'https://dukkani-app.onrender.com/static/logo_customer.png'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/assets -D

    - name: Create dummy www folder
      run: mkdir www && echo "<html><body>Loading...</body></html>" > www/index.html

    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Change App Name Dynamically
      run: |
        APP_NAME="${{ github.event.inputs.appName || 'دُكّاني أعمال' }}"
        sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/g" android/app/src/main/res/values/strings.xml

    - name: Generate App Icons
      run: |
        mkdir assets
        curl -o assets/icon.png "${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}"
        curl -o assets/splash.png "${{ github.event.inputs.logoUrl || 'https://dukkani-app.onrender.com/static/logo_customer.png' }}"
        npx capacitor-assets generate --android

    - name: Download Custom Cashier Ringtone
      run: |
        mkdir -p android/app/src/main/res/raw
        curl -L -o android/app/src/main/res/raw/dukkani_ring.mp3 "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "⚠️ تحذير: لم يتم العثور على سر GOOGLE_SERVICES_JSON!"
        else
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        fi

    - name: Inject Firebase Push Notifications
      run: |
        # إضافة البلوجن إلى build.gradle الأساسي
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' android/build.gradle
        # إضافة المكتبات وتفعيل البلوجن في app/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        sed -i '/dependencies {/a \    implementation platform("com.google.firebase:firebase-bom:32.1.1" )\n    implementation "com.google.firebase:firebase-messaging"' android/app/build.gradle

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "dukkani123" -keypass "dukkani123" -dname "CN=Dukkani, OU=App, O=Company, L=City, ST=State, C=Country"
        mv release.keystore android/app/

    - name: Build and Sign Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=release.keystore \
          -Pandroid.injected.signing.store.password=dukkani123 \
          -Pandroid.injected.signing.key.alias=my-key-alias \
          -Pandroid.injected.signing.key.password=dukkani123

    - name: Upload VIP Release APK
      uses: actions/upload-artifact@v5
      with:
        name: ${{ github.event.inputs.appName || 'Dukkani' }}-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
